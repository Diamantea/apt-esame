# Build, test (unit, integration, BDD), mutation testing and coverage.
# Coveralls only when the token is available (not in external PRs,
# e.g. Dependabot's) and only in one configuration of the matrix.

name: Java CI with Maven in Ubuntu

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    strategy:
      matrix:
        java: [21]

    name: Build with Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '**/*.yml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Set Maven Additional Options
        run: echo "ADDITIONAL_MAVEN_OPTIONS=-Pcoveralls" >> $GITHUB_ENV
        if: ${{ env.COVERALLS_REPO_TOKEN && matrix.java == 21 }}
      - name: Build with Maven
        run: mvn verify -Pmutation-testing $ADDITIONAL_MAVEN_OPTIONS
      - name: Generate JUnit Report
        run: mvn surefire-report:report-only surefire-report:failsafe-report-only
        if: ${{ always() }}
      - name: Archive JUnit Report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: test-reports-jdk-${{ matrix.java }}
          path: |
            **/target/reports
            **/target/pit-reports
